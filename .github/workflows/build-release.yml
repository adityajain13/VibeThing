name: Build VibeThing

# Run by hand from the Actions tab; the Windows builds are kept as workflow artifacts
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build the client and the app
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibething-windows-${{ github.sha }}
          path: |
            ./dist/VibeThing-*-setup.exe
            ./dist/VibeThing-*-win-x64.zip
